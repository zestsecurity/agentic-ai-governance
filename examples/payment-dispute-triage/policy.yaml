apiVersion: governance.toolkit/v1
name: payment-dispute-triage-demo
default_action: deny
rules:
  - name: allow-read-only-triage
    condition: "action.type == 'read_case'"
    action: allow
    description: "Triage may read a case and return a summary"
  - name: block-financial-write-actions
    condition: "action.type in ['issue_refund', 'update_account', 'approve_dispute', 'deny_dispute']"
    action: deny
    description: "This triage Skill is read-only; a human must make financial decisions"
